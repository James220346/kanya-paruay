<body class="text-slate-800 antialiased min-h-screen font-sans">

    <nav class="bg-white shadow-sm sticky top-0 z-40 border-b border-slate-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-16 items-center">

                    <div class="bg-primary text-white p-2 rounded-xl shadow-sm"><i data-feather="monitor" class="w-5 h-5"></i></div>
                    <h1 class="text-xl font-display text-slate-800 tracking-wide">ระบบจัดการหลังบ้าน</h1>
                </div>
                <div class="flex items-center gap-3">
                    <button onclick="clearEntireBoard()" class="hidden sm:flex text-sm font-bold text-red-600 bg-red-50 border border-red-200 px-4 py-2 rounded-lg hover:bg-red-500 hover:text-white transition-all items-center gap-2 shadow-sm">

                    <a href="index.html" target="_blank" class="text-sm font-bold text-primary bg-pink-50 border border-pink-200 px-4 py-2 rounded-lg hover:bg-pink-100 transition-colors flex items-center gap-2 shadow-sm">

                 <button onclick="clearEntireBoard()" class="w-full text-sm font-bold text-red-600 bg-red-50 border border-red-200 px-4 py-2 rounded-lg hover:bg-red-500 hover:text-white transition-all flex justify-center items-center gap-2 shadow-sm">
                    <i data-feather="trash-2" class="w-4 h-4"></i> ล้างกระดานทั้งหมด (เริ่มงวดใหม่)
                </button>
            </div>
        </div>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-center gap-5">
                <div class="w-14 h-14 rounded-full bg-green-100 text-green-600 flex items-center justify-center shrink-0">
                    <i data-feather="dollar-sign" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-slate-500 mb-1">ยอดขายรวมงวดนี้</p>
                    <h2 class="text-3xl font-extrabold text-slate-800">฿<span id="dash-revenue">0</span></h2>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-center gap-5">
                <div class="w-14 h-14 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center shrink-0">
                    <i data-feather="check-circle" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-slate-500 mb-1">ขายแล้ว</p>
                    <h2 class="text-3xl font-extrabold text-slate-800"><span id="dash-sold">0</span> <span class="text-lg font-medium text-slate-500">ตัว</span></h2>
                </div>
            </div>

            <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 flex items-center gap-5">
                <div class="w-14 h-14 rounded-full bg-orange-100 text-orange-600 flex items-center justify-center shrink-0">
                    <i data-feather="grid" class="w-7 h-7"></i>
                </div>
                <div>
                    <p class="text-sm font-bold text-slate-500 mb-1">เลขว่างบนแผง</p>
                    <h2 class="text-3xl font-extrabold text-slate-800"><span id="dash-available">100</span> <span class="text-lg font-medium text-slate-500">ตัว</span></h2>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 mb-8">
            <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2 mb-4">
                <i data-feather="layout" class="w-5 h-5 text-primary"></i> เปลี่ยนธีมหน้าร้านลูกค้า (Theme Shop)
            </h3>
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
                <button onclick="changeTheme('pink')" class="relative flex flex-col items-center justify-center p-5 border-2 border-pink-200 bg-pink-50/50 rounded-2xl hover:bg-pink-100/50 hover:border-pink-400 transition-all group shadow-sm">
                    <span class="text-4xl mb-2 group-hover:scale-110 transition-transform">💖</span>
                    <span class="font-bold text-pink-600">ธีม: ชมพูหวานใจ</span>
                    <span class="text-xs text-pink-400 mt-1">(ค่าเริ่มต้นระบบ)</span>
                </button>
                <button onclick="changeTheme('gold')" class="relative flex flex-col items-center justify-center p-5 border-2 border-amber-200 bg-amber-50/50 rounded-2xl hover:bg-amber-100/50 hover:border-amber-400 transition-all group shadow-sm">
                    <span class="text-4xl mb-2 group-hover:scale-110 transition-transform">💰</span>
                    <span class="font-bold text-amber-600">ธีม: ทองมหาเศรษฐี</span>
                    <span class="text-xs text-amber-500 mt-1">โทนสีทองเรียกทรัพย์</span>
                </button>
                <button onclick="changeTheme('green')" class="relative flex flex-col items-center justify-center p-5 border-2 border-emerald-200 bg-emerald-50/50 rounded-2xl hover:bg-emerald-100/50 hover:border-emerald-400 transition-all group shadow-sm">
                    <span class="text-4xl mb-2 group-hover:scale-110 transition-transform">🍀</span>
                    <span class="font-bold text-emerald-600">ธีม: เขียวเหนี่ยวทรัพย์</span>
                    <span class="text-xs text-emerald-500 mt-1">โทนสีเขียวรับโชคใหญ่</span>
                </button>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
            <div class="px-6 py-5 border-b border-slate-100 flex justify-between items-center bg-slate-50/50">
                <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2">
                    <i data-feather="users" class="w-5 h-5 text-primary"></i> รายการจองตัวเลขล่าสุด
                </h3>
            </div>
            
            <div class="overflow-x-auto custom-scrollbar">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-sm">
                            <th class="px-6 py-4 font-bold min-w-[140px]">วัน-เวลาที่สั่งซื้อ</th>
                            <th class="px-6 py-4 font-bold min-w-[150px]">ชื่อลูกค้า</th>
                            <th class="px-6 py-4 font-bold min-w-[150px]">เลขที่จอง</th>
                            <th class="px-6 py-4 font-bold min-w-[100px]">ยอดรวม</th>
                            <th class="px-6 py-4 font-bold min-w-[120px]">สถานะชำระเงิน</th>
                            <th class="px-6 py-4 font-bold text-center min-w-[120px]">หลักฐานบิล</th>
                            <th class="px-6 py-4 font-bold text-right min-w-[120px]">จัดการกระดาน</th>
                        </tr>
                    </thead>
                    <tbody id="bookings-table-body" class="divide-y divide-slate-100">
                        <tr>
                            <td colspan="7" class="px-6 py-10 text-center text-slate-400 font-medium">
                                <i data-feather="loader" class="w-6 h-6 animate-spin mx-auto mb-2"></i> กำลังเชื่อมต่อข้อมูลระบบ...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="slip-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-[100] hidden flex items-center justify-center p-4 opacity-0 transition-opacity duration-300">
        <div class="bg-white rounded-2xl max-w-md w-full overflow-hidden shadow-2xl transform scale-95 transition-transform duration-300" id="slip-modal-content">
            <div class="px-4 py-3 border-b border-slate-100 flex justify-between items-center bg-slate-50">
                <h3 class="font-bold text-slate-800 flex items-center gap-2">
                    <i data-feather="image" class="w-4 h-4"></i> หลักฐานสลิปโอนเงินลูกค้า
                </h3>
                <button onclick="closeSlipModal()" class="text-slate-400 hover:text-red-500 transition-colors p-1">
                    <i data-feather="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-4 bg-slate-100 flex items-center justify-center min-h-[300px]">
                <img id="slip-image-full" src="" alt="สลิปโอนเงิน" class="max-w-full max-h-[60vh] object-contain rounded-lg shadow-sm border border-slate-200">
            </div>
            <div class="p-4 bg-white">
                <button onclick="closeSlipModal()" class="w-full py-2.5 bg-slate-800 text-white rounded-xl font-bold hover:bg-slate-700 transition-colors">ปิดหน้าต่าง</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-app.js";
        import { getDatabase, ref, onValue, remove, runTransaction, set } from "https://www.gstatic.com/firebasejs/9.22.0/firebase-database.js";

        // รหัสการตั้งค่า Firebase พารวย ของแผงคุณสุกัญญา
        const firebaseConfig = {
            apiKey: "AIzaSyBF6WyNU-Pn8z538iy7fuWkuUyizKoP_4",
            authDomain: "kanya-paruay.firebaseapp.com",
            databaseURL: "https://kanya-paruay-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "kanya-paruay"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // เปิดใช้งานระบบไอคอนขนนกบนหน้าเว็บ
        feather.replace();

        let globalBookings = {};
        let globalSoldNumbers = [];

        // ฟังก์ชันระบบสลับธีมร้านค้าส่งข้อมูลไปยังหน้าร้านลูกค้าแบบ Real-time
        window.changeTheme = async function(themeName) {
            try {
                await set(ref(db, 'app_settings/current_theme'), themeName);
                alert(`🎯 ทำการอัปเดตระบบเปลี่ยนสีหน้าร้านเป็น "ธีม: ${themeName}" เรียบร้อยแล้วค่ะ!`);
            } catch (error) {
                console.error("Theme Error:", error);
                alert("เกิดข้อผิดพลาดในการเปลี่ยนรูปแบบธีม กรุณาลองใหม่อีกครั้งค่ะ");
            }
        }

        // ฟังก์ชันเปิดดูรูปภาพสลิปแบบขยายใหญ่
        window.openSlipModal = function(url) {
            if(!url || url === 'ไม่ได้แนบสลิป') return;
            const modal = document.getElementById('slip-modal');
            const content = document.getElementById('slip-modal-content');
            document.getElementById('slip-image-full').src = url;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                modal.classList.remove('opacity-0');
                content.classList.replace('scale-95', 'scale-100');
            }, 10);
        }

        window.closeSlipModal = function() {
            const modal = document.getElementById('slip-modal');
            const content = document.getElementById('slip-modal-content');
            modal.classList.add('opacity-0');
            content.classList.replace('scale-100', 'scale-95');
            setTimeout(() => {
                modal.classList.add('hidden');
                document.getElementById('slip-image-full').src = "";
            }, 300);
        }

        // ฟังก์ชันยกเลิกบิลออเดอร์รายบุคคลและยึดตัวเลขคืนแผงหน้าร้าน
        window.deleteAndReturnNumbers = async function(bookingId, numbersString) {
            const numbersArr = numbersString.split(',');
            const isConfirmed = confirm(`⚠️ ยืนยันการยกเลิกบิลออเดอร์:\n\nคุณต้องการยกเลิกบิลนี้ และส่งคืนตัวเลข [ ${numbersString} ] กลับเข้าสู่แผงเพื่อให้ลูกค้าคนอื่นเลือกซื้อใหม่ใช่ไหมคะ?`);
            
            if (isConfirmed) {
                try {
                    // 1. ลบเลขออกจากกลุ่มตัวเลขที่ขายแล้วในฐานข้อมูลหลัก
                    await runTransaction(ref(db, 'sold_out_numbers'), (currentSold) => {
                        if (!currentSold) return [];
                        return currentSold.filter(num => !numbersArr.includes(num));
                    });

                    // 2. ลบบันทึกประวัติบิลการซื้อของลูกค้ารายนี้ออก
                    await remove(ref(db, `customer_bookings/${bookingId}`));

                    alert('✅ ทำการยึดตัวเลขคืนแผงร้าน และเคลียร์บิลเรียบร้อยสำเร็จแล้วค่ะ!');
                } catch (error) {
                    console.error("Delete Error:", error);
                    alert("ระบบติดขัดไม่สามารถลบบิลได้ กรุณาลองใหม่อีกครั้งค่ะ");
                }
            }
        }

        // ฟังก์ชันล้างกระดานแผงหวยทั้งหมดแบบแมนนวล (มีระบบล็อกความปลอดภัยสองชั้น)
        window.clearEntireBoard = async function() {
            const confirm1 = confirm("⚠️ คำเตือนระดับสูงสุด (ล้างระบบทั้งหมด):\n\nคุณกำลังจะทำการล้างกระดานตัวเลขและประวัติการซื้อลูกค้าทั้งหมดในงวดนี้! ข้อมูลจะหายถาวรไม่สามารถกู้คืนได้\n\nคุณแน่ใจจริงๆ ใช่ไหมที่จะเคลียร์แผงเพื่อเริ่มงวดใหม่?");
            
            if (confirm1) {
                const confirm2 = prompt("🔒 ระบบความปลอดภัยเพื่อป้องกันการกดพลาด:\n\nกรุณาพิมพ์คำว่า 'ยืนยัน' ในช่องด้านล่างเพื่อล้างกระดานทั้งหมดค่ะ");
                
                if (confirm2 === "ยืนยัน") {
                    try {
                        // เคลียร์ค่าฐานข้อมูลตัวเลขและประวัติการซื้อเป็นค่าว่างทั้งหมด
                        await set(ref(db, 'sold_out_numbers'), []);
                        await set(ref(db, 'customer_bookings'), []);
                        
                        // บันทึกวันที่เพื่อคงการทำงานของระบบรีเซ็ตอัตโนมัติงวดถัดไป
                        localStorage.setItem('lastResetDate', new Date().toDateString());
                        
                        alert("🎉 สำเร็จ! ระบบได้ทำการล้างกระดานเรียบร้อยแล้ว แผงหวยของคุณว่าง 100 ตัว พร้อมเปิดขายงวดใหม่แล้วค่ะ เฮงๆ รวยๆ นะคะ!");
                    } catch (error) {
                        console.error("Clear Board Error:", error);
                        alert("เกิดความผิดพลาดในการล้างระบบ กรุณาตรวจสอบการเชื่อมต่ออินเทอร์เน็ตค่ะ");
                    }
                } else if (confirm2 !== null) {
                    alert("❌ ล้างระบบไม่สำเร็จเนื่องจากพิมพ์คำยืนยันไม่ถูกต้องค่ะ");
                }
            }
        }

        // โหลดข้อมูลตัวเลขที่ขายแล้วแบบ Real-time
        onValue(ref(db, 'sold_out_numbers'), (snapshot) => {
            globalSoldNumbers = snapshot.val() || [];
            updateDashboard();
        });

        // โหลดประวัติบิลลูกค้าทั้งหมดแบบ Real-time
        onValue(ref(db, 'customer_bookings'), (snapshot) => {
            globalBookings = snapshot.val() || {};
            renderTable();
            updateDashboard();
        });

        // ฟังก์ชันคำนวณและอัปเดตยอดขายบนแดชบอร์ด
        function updateDashboard() {
            const soldCount = globalSoldNumbers.length;
            const availableCount = 100 - soldCount;
            
            document.getElementById('dash-sold').innerText = soldCount;
            document.getElementById('dash-available').innerText = availableCount;

            let totalRevenue = 0;
            Object.values(globalBookings).forEach(booking => {
                totalRevenue += (booking.totalPrice || 0);
            });
            document.getElementById('dash-revenue').innerText = totalRevenue.toLocaleString();
        }

        // ฟังก์ชันแสดงรายการบิลลูกค้าลงตาราง (จัดเรียงออเดอร์ล่าสุดขึ้นก่อน)
        function renderTable() {
            const tbody = document.getElementById('bookings-table-body');
            if(!tbody) return;
            tbody.innerHTML = '';

            const bookingsArray = Object.entries(globalBookings).map(([id, data]) => {
                return { id, ...data };
            }).sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

            if (bookingsArray.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="px-6 py-10 text-center text-slate-400 font-medium bg-slate-50/50">ตลาดยังเงียบอยู่เลย งวดนี้ยังไม่มีรายการสั่งซื้อเข้ามาในระบบค่ะ</td></tr>`;
                return;
            }

            bookingsArray.forEach(booking => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-pink-50/30 transition-colors group border-b border-slate-100";
                
                const dateText = booking.purchaseDate || booking.lastUpdated || '-';
                
                let paymentBadge = '';
                if(booking.paymentMethod === 'pay_now') {
                    paymentBadge = `<span class="inline-flex items-center gap-1 bg-green-100 text-green-700 px-2.5 py-1 rounded-md text-xs font-bold border border-green-200"><i data-feather="check-circle" class="w-3 h-3"></i> โอนแล้ว</span>`;
                } else {
                    paymentBadge = `<span class="inline-flex items-center gap-1 bg-amber-100 text-amber-700 px-2.5 py-1 rounded-md text-xs font-bold border border-amber-200"><i data-feather="clock" class="w-3 h-3"></i> จ่ายทีหลัง</span>`;
                }

                let slipBtn = '';
                if(booking.slipImageUrl && booking.slipImageUrl !== 'ไม่ได้แนบสลิป') {
                    slipBtn = `<button onclick="openSlipModal('${booking.slipImageUrl}')" class="inline-flex items-center gap-1 bg-blue-50 text-blue-600 hover:bg-blue-100 px-3 py-1.5 rounded-lg text-sm font-bold transition-colors border border-blue-200 shadow-sm"><i data-feather="image" class="w-4 h-4"></i> ดูรูปสลิป</button>`;
                } else {
                    slipBtn = `<span class="text-xs text-slate-400 bg-slate-100 px-2.5 py-1.5 rounded-md">ไม่มีรูปสลิป</span>`;
                }

                const numbersJoined = booking.selectedNumbers ? booking.selectedNumbers.join(',') : '';

                tr.innerHTML = `
                    <td class="px-6 py-4 text-sm text-slate-500">${dateText}</td>
                    <td class="px-6 py-4 font-bold text-slate-800">${booking.customerName}</td>
                    <td class="px-6 py-4">
                        <div class="flex flex-wrap gap-1 max-w-[180px]">
                            ${booking.selectedNumbers ? booking.selectedNumbers.map(n => `<span class="bg-slate-100 border border-slate-200 text-slate-700 text-xs font-extrabold px-2 py-0.5 rounded shadow-inner">${n}</span>`).join('') : '-'}
                        </div>
                    </td>
                    <td class="px-6 py-4 font-extrabold text-primaryDark text-base">฿${(booking.totalPrice || 0).toLocaleString()}</td>
                    <td class="px-6 py-4">${paymentBadge}</td>
                    <td class="px-6 py-4 text-center">${slipBtn}</td>
                    <td class="px-6 py-4 text-right">
                        <button onclick="deleteAndReturnNumbers('${booking.id}', '${numbersJoined}')" class="inline-flex items-center gap-1 text-red-500 hover:text-white bg-red-50 hover:bg-red-500 px-3 py-2 rounded-lg text-sm font-bold transition-all border border-red-100 hover:border-red-500 shadow-sm group-hover:opacity-100 md:opacity-60">
                            <i data-feather="trash-2" class="w-4 h-4"></i> ยึดคืน
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
            feather.replace();
        }
    </script>
</body>
